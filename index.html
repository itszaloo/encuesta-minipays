<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Encuesta Minipays</title>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #000, #1a1a1a);
    color: white;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 20px;
    background: rgba(20,20,20,0.9);
    border-radius: 15px;
    box-shadow: 0 0 20px #ff00ff;
}

h2 {
    font-family: 'Permanent Marker', cursive;
    text-align: center;
    color: #ff00ff;
    font-size: 28px;
}

h3 {
    color: #00ffff;
    border-bottom: 1px solid #444;
}

p {
    margin: 10px 0 5px;
}

input, textarea {
    margin-bottom: 8px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    color: black;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

label {
    display: block;
    margin-left: 10px;
}
</style>
</head>

<body>

<div class="container">
<h2>Encuesta Minipays</h2>

<form action="https://formspree.io/f/mqewrbav" method="POST">

<h3>Datos generales</h3>
<p>¿Qué edad tienes?</p>
<label><input type="radio" name="edad" value="12-14"> 12-14</label>
<label><input type="radio" name="edad" value="15-17"> 15-17</label>
<label><input type="radio" name="edad" value="18+"> 18+</label>

<p>¿Eres?</p>
<label><input type="radio" name="rol" value="Estudiante"> Estudiante</label>
<label><input type="radio" name="rol" value="Docente"> Docente</label>
<label><input type="radio" name="rol" value="Otro"> Otro</label>

<h3>Hábitos</h3>
<p>¿Frecuencia de compra?</p>
<label><input type="radio" name="freq" value="Diario"> Diario</label>
<label><input type="radio" name="freq" value="2-3 semana"> 2-3 semana</label>
<label><input type="radio" name="freq" value="1 vez"> 1 vez</label>
<label><input type="radio" name="freq" value="Nunca"> Nunca</label>

<p>¿Qué consumes?</p>
<label><input type="checkbox" name="pref" value="Dulces"> Dulces</label>
<label><input type="checkbox" name="pref" value="Botanas"> Botanas</label>
<label><input type="checkbox" name="pref" value="Pan"> Pan</label>
<label><input type="checkbox" name="pref" value="Bebidas"> Bebidas</label>

<h3>Preferencias</h3>
<p>¿Te gustan los minipays?</p>
<label><input type="radio" name="gusto" value="Si"> Sí</label>
<label><input type="radio" name="gusto" value="No"> No</label>
<label><input type="radio" name="gusto" value="A veces"> A veces</label>

<p>¿Sabor?</p>
<label><input type="radio" name="sabor" value="Fresa"> Fresa</label>
<label><input type="radio" name="sabor" value="Mango"> Mango</label>
<label><input type="radio" name="sabor" value="Queso"> Queso</label>
<label><input type="radio" name="sabor" value="Chocolate"> Chocolate</label>

<h3>Precio</h3>
<label><input type="radio" name="precio" value="15-20"> $15-20</label>
<label><input type="radio" name="precio" value="21-25"> $21-25</label>
<label><input type="radio" name="precio" value="26-30"> $26-30</label>
<label><input type="radio" name="precio" value="30+"> +$30</label>

<h3>Opinión</h3>
<p>¿Comprarías?</p>
<label><input type="radio" name="comp" value="Si"> Sí</label>
<label><input type="radio" name="comp" value="No"> No</label>
<label><input type="radio" name="comp" value="Tal vez"> Tal vez</label>

<p>¿Qué mejorarías?</p>
<textarea name="mejoras" rows="4" style="width:100%;" placeholder="Escribe tu opinión aquí..."></textarea>

<button type="submit">Enviar</button>

</form>
</div>

<!-- SCRIPT PARA DESELECCIONAR -->
<script>
document.querySelectorAll('input[type="radio"]').forEach(radio => {
  radio.addEventListener('click', function() {
    if (this.wasChecked) {
      this.checked = false;
      this.wasChecked = false;
    } else {
      document.querySelectorAll(input[name="${this.name}"]).forEach(r => r.wasChecked = false);
      this.wasChecked = true;
    }
  });
});
</script>

</body>
</html>
